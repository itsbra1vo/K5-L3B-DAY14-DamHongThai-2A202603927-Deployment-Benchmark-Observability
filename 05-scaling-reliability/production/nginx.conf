events { worker_connections 256; }

http {
    # Re-resolve Docker's service DNS so a removed replica leaves the pool.
    resolver 127.0.0.11 valid=2s ipv6=off;

    upstream agent_cluster {
        zone agent_cluster 64k;
        server agent:8000 resolve;
        keepalive 16;
    }

    server {
        listen 80;

        # Add instance header để thấy rõ load balancing
        add_header X-Served-By $upstream_addr always;

        location / {
            proxy_pass http://agent_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 3;
        }

        location /health {
            proxy_pass http://agent_cluster/health;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 3;
            access_log off;
        }

        location /ready {
            proxy_pass http://agent_cluster/ready;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 3;
            access_log off;
        }
    }
}
