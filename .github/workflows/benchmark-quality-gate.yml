name: Agent quality gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start agent
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 MOCK_SLOW_RATE=0 python app.py > /tmp/agent.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/agent.log
          exit 1
      - name: Evaluate golden dataset (minimum 85% accuracy)
        run: python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 --out reports/ci_eval.json
